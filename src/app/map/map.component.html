<div class="absolute z-50">
  <p-button>Show best route</p-button>
</div>
<div style="max-width: 50vw; max-height: 75vh;" class="max-w-[50vw] max-h-[75vh] scroll" #map>
  <div class="flex flex-row gap-32 items-center justify-start">
    <ng-container *ngFor="let biomeList of getFilteredBiomeData()">
      <div class="element">
        <app-biome *ngFor="let biome of biomeList" [biomeModel]="biome" [id]="biome.id"></app-biome>
      </div>
    </ng-container>
  </div>
</div>
